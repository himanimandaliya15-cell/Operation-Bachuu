<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>A Letter For You ❤️</title>

<style>
body{
    margin:0;
    background:#050816;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    padding:25px;
}

.card{
    max-width:600px;
    background:#11162d;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 25px rgba(255,64,129,.3);
}

h1{
    color:#ff4f8b;
}

#typing{
    white-space:pre-line;
    font-size:20px;
    line-height:1.8;
    min-height:250px;
}

button{
    margin-top:25px;
    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:#ff4f8b;
    color:white;
    font-size:18px;
}
</style>

<script src="./chrome-compat.js"></script>
</head>

<body>

<div class="card">

<h1>💌 A Letter For You</h1>

<p id="typing"></p>

<button onclick="window.location.href='gift.html'">
Open Your Gift 🎁
</button>

</div>

<script>

const message=`Happy Birthday, My Love ❤️

Today is all about celebrating the amazing person you are.

Thank you for every smile, every laugh, every hug and every memory we've created together.

You make ordinary days feel extraordinary.

No matter what life brings, I know one thing...

I will always choose you.

I love you endlessly. ❤️`;

let i=0;

function type(){

    if(i<message.length){

        document.getElementById("typing").innerHTML+=message.charAt(i);

        i++;

        setTimeout(type,35);

    }

}

type();

</script>

</body>
</html>
