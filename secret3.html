<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Final Surprise ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:radial-gradient(circle,#1b0030,#000);

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

color:white;

text-align:center;

}

.card{

width:90%;
max-width:700px;

padding:35px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

border-radius:25px;

box-shadow:0 0 35px rgba(255,105,180,.35);

z-index:5;

}

h1{

font-size:40px;

color:#ff6ec7;

margin-bottom:20px;

text-shadow:0 0 15px #ff6ec7;

}

p{

font-size:22px;

line-height:1.8;

margin-bottom:20px;

}

.heart{

position:absolute;

font-size:24px;

animation:float 8s linear infinite;

}

@keyframes float{

0%{

transform:translateY(100vh) scale(.5);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.4);

opacity:0;

}

}

#finish{

margin-top:25px;

padding:14px 35px;

border:none;

border-radius:40px;

background:#ff6ec7;

color:white;

font-size:18px;

cursor:pointer;

}

#finish:hover{

transform:scale(1.05);

}

</style>

<script src="./chrome-compat.js"></script>
</head>

<body>

<div class="card">

<h1>🎂 Happy Birthday Bachuu ❤️</h1>

<p>

I hope this little adventure made you smile.

Every mission...

Every surprise...

Every line of code...

was made with love, only for you.

❤️

</p>

<p>

Thank you for being my favourite person.

No matter what happens...

I'll always cheer for you.

✨

</p>

<h2>

I Love You Forever ❤️

</h2>

<button id="finish" onclick="goHome()">

🏠 Return to Dashboard

</button>

</div>

<audio id="music" src="music/memory.mp3" autoplay loop></audio>

<audio id="victory" src="music/victory.mp3"></audio>

<script>

for(let i=0;i<80;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML=["❤️","💖","💕","💗"][Math.floor(Math.random()*4)];

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(5+Math.random()*5)+"s";

h.style.fontSize=(18+Math.random()*24)+"px";

document.body.appendChild(h);

}

document.getElementById("victory").play();

function goHome(){

window.location.href="dashboard.html";

}

</script>

</body>

</html>
