<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Memory ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(180deg,#02030a,#09122d);

color:white;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

}

.container{

width:90%;
max-width:700px;

background:rgba(255,255,255,.06);

backdrop-filter:blur(15px);

padding:30px;

border-radius:25px;

text-align:center;

box-shadow:0 0 35px rgba(255,255,255,.15);

}

h1{

color:#ff6ec7;

margin-bottom:20px;

}

#letter{

font-size:20px;

line-height:1.8;

min-height:240px;

text-align:left;

white-space:pre-line;

}

#photo{

display:none;

width:230px;

border-radius:20px;

margin:25px auto;

box-shadow:0 0 25px rgba(255,255,255,.3);

}

button{

display:none;

margin-top:25px;

padding:14px 35px;

border:none;

border-radius:40px;

background:#ff6ec7;

color:white;

font-size:18px;

cursor:pointer;

}

button:hover{

transform:scale(1.05);

}

</style>

<script src="./chrome-compat.js"></script>
</head>

<body>

<div class="container">

<h1>💌 Dear Bachuu...</h1>

<div id="letter"></div>

<img src="images/ourphoto.jpg" id="photo">

<button onclick="location.href='secret3.html'">

🎁 One Last Surprise

</button>

</div>

<script>

const text=

`If you've reached here...

it means you explored every corner
of this little world I made for you.

That's something I absolutely love about you. ❤️

Thank you for every laugh,
every memory,
every smile,
and every moment.

No matter how many missions you complete...

You'll always be my favourite one.

— Himani ❤️`;

let i=0;

const letter=document.getElementById("letter");

function typeLetter(){

if(i<text.length){

letter.innerHTML+=text.charAt(i);

i++;

setTimeout(typeLetter,40);

}
else{

document.getElementById("photo").style.display="block";

document.querySelector("button").style.display="inline-block";

}

}

typeLetter();

</script>

</body>

</html>
