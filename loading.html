<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mission Control</title>

<style>

body{
margin:0;
background:#000814;
color:#00ff88;
font-family:monospace;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
width:90%;
}

h1{
font-size:32px;
margin-bottom:30px;
}

.bar{
width:100%;
height:25px;
background:#111;
border-radius:30px;
overflow:hidden;
margin:30px 0;
}

.fill{
height:100%;
width:0%;
background:#00ff88;
transition:.1s;
}

#percent{
font-size:28px;
}

#status{
margin-top:20px;
font-size:18px;
color:white;
}

</style>

<script src="./chrome-compat.js"></script>
</head>

<body>

<div class="container">

<h1>🚀 OPERATION BACHUU</h1>

<div class="bar">

<div class="fill" id="fill"></div>

</div>

<div id="percent">0%</div>

<div id="status">

Initializing Mission...

</div>

</div>

<script>

let progress=0;

let fill=document.getElementById("fill");

let percent=document.getElementById("percent");

let status=document.getElementById("status");

let messages=[

"Connecting to Himani's Heart ❤️",

"Scanning Agent Hetav...",

"Checking Tennis Skills 🎾",

"Checking Engineering Brain 🧠",

"Loading Bike Garage 🏍️",

"Loading Producer Studio 🎧",

"Decrypting Love Files ❤️",

"Mission Ready 🚀"

];

let i=0;

let timer=setInterval(function(){

progress++;

fill.style.width=progress+"%";

percent.innerHTML=progress+"%";

if(progress%12===0 && i<messages.length){

status.innerHTML=messages[i];

i++;

}

if(progress>=100){

clearInterval(timer);

setTimeout(function(){

window.location.replace("dashboard.html");

},1000);

}

},50);

</script>

</body>
</html>
