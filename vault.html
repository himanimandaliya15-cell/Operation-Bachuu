<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Vault</title>

<style>

/* ================================
   BASIC PAGE
================================ */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    padding: 18px;
    font-family: Arial, sans-serif;
    background: #050816;
    color: white;
    text-align: center;
    overflow-x: hidden;
}


/* ================================
   TITLE
================================ */

h1 {
    margin: 5px 0 8px;
    color: #20F7D5;
    font-size: clamp(28px, 4vw, 44px);
}

h2 {
    margin: 0 0 18px;
    font-size: clamp(14px, 2vw, 18px);
    font-weight: normal;
}


/* ================================
   MEMORY GALLERY
================================ */

.gallery {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;

    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 14px;
}


/* DESKTOP PHOTOS */

.gallery img {
    width: 100%;

    /*
       IMPORTANT:
       Keeps the photos inside the
       visible laptop screen.
    */
    height: min(42vh, 360px);

    object-fit: cover;

    border-radius: 15px;

    cursor: pointer;

    display: block;

    transition: transform 0.3s ease;
}

.gallery img:hover {
    transform: scale(1.02);
}


/* ================================
   CONTINUE BUTTON
================================ */

button {
    margin-top: 18px;
    padding: 12px 32px;

    border: none;
    border-radius: 30px;

    background: #ff4f8b;
    color: white;

    font-size: 17px;

    cursor: pointer;
}

button:hover {
    transform: scale(1.04);
}


/* ================================
   POPUP
================================ */

.popup {
    display: none;

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.65);

    backdrop-filter: blur(10px);

    justify-content: center;
    align-items: center;

    z-index: 999;
}


.popup-content {
    width: min(90%, 400px);

    max-height: 90vh;

    overflow-y: auto;

    background: rgba(255, 255, 255, 0.12);

    border-radius: 20px;

    padding: 18px;

    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);

    animation: zoom 0.35s;
}


#popupImg {
    width: 100%;
    max-height: 65vh;

    object-fit: contain;

    border-radius: 15px;

    display: block;
}


#popupText {
    margin: 15px 0;

    line-height: 1.5;

    font-size: 17px;
}


.closeBtn {
    background: #ff4f8b;

    color: white;

    border: none;

    padding: 10px 28px;

    border-radius: 30px;

    cursor: pointer;
}


/* ================================
   POPUP ANIMATION
================================ */

@keyframes zoom {

    from {
        transform: scale(0.7);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }

}


/* ================================
   TABLET
================================ */

@media (max-width: 900px) and (min-width: 601px) {

    body {
        padding: 15px;
    }

    .gallery {
        gap: 12px;
    }

    .gallery img {
        height: 38vh;
    }

}


/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 6px;
    }

    h2 {
        font-size: 15px;
        margin-bottom: 15px;
    }

    .gallery {

        grid-template-columns: 1fr;

        width: 100%;

        gap: 12px;

        padding: 0 3px;
    }

    .gallery img {

        width: 100%;

        /*
           Mobile keeps a natural
           portrait-friendly ratio.
        */
        height: auto;

        aspect-ratio: 4 / 3;

        object-fit: cover;

        border-radius: 14px;
    }

    .gallery img:hover {
        transform: none;
    }

    button {

        margin-top: 15px;

        padding: 11px 26px;

        font-size: 15px;
    }

    #popupImg {
        max-height: 55vh;
    }

    #popupText {
        font-size: 15px;
    }

}


/* ================================
   SMALL PHONES
================================ */

@media (max-width: 400px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 25px;
    }

    h2 {
        font-size: 14px;
    }

    .gallery {
        gap: 10px;
    }

    .gallery img {
        aspect-ratio: 4 / 3;
    }

}


/* ================================
   SHORT LAPTOP SCREENS
================================ */

@media (min-width: 901px) and (max-height: 750px) {

    .gallery img {
        height: 35vh;
    }

    button {
        margin-top: 12px;
    }

}

</style>

<script src="./chrome-compat.js"></script>

</head>


<body>

<h1>📸 MEMORY VAULT</h1>

<h2>Every mission leaves memories ❤️</h2>


<!-- ================================
     PHOTO GALLERY
================================ -->

<div class="gallery">

    <img
        src="photo1.jpg"
        onclick="openPhoto(
            'photo1.jpg',
            'The day our story finally became real. One meeting, one moment, and somehow.... everything just felt different. ❤️ P.S. I know this is not our first meeting photo, but we didnt click one first time'
)"
            >

    <img
        src="photo2.jpg"
        onclick="openPhoto(
            'photo2.jpg',
            'The first time it was just you and me away from everything else. A little moment of peace that became one of my most precious moments 🕊️'
        )"
    >

    <img
        src="photo3.jpg"
        onclick="openPhoto(
            'photo3.jpg',
            'Our first little adventure together. Just you, me, the bike, and a road full of memories.🏍️'
        )"
    >

    <img
        src="photo4.jpg"
        onclick="openPhoto(
            'photo4.jpg',
            'Some moments are meant to stay between two hearts. Quiet, precious, and ours alone.... memories I will always keep close. IYKYK💗'
        )"
    >

</div>


<!-- ================================
     PHOTO POPUP
================================ -->

<div id="popup" class="popup">

    <div class="popup-content">

        <img id="popupImg">

        <p id="popupText"></p>

        <button
            class="closeBtn"
            onclick="closePhoto()"
        >
            Close
        </button>

    </div>

</div>


<!-- ================================
     MUSIC
================================ -->

<audio id="bgMusic" loop autoplay>

    <source
        src="music/memory.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- ================================
     NEXT MISSION
================================ -->

<button onclick="nextMission()">
    Continue ➜
</button>


<script>

/* ================================
   OPEN PHOTO
================================ */

function openPhoto(img, text) {

    document.getElementById("popup").style.display = "flex";

    document.getElementById("popupImg").src = img;

    document.getElementById("popupText").innerHTML = text;

}


/* ================================
   CLOSE PHOTO
================================ */

function closePhoto() {

    document.getElementById("popup").style.display = "none";

}


/* ================================
   NEXT MISSION
================================ */

function nextMission() {

    location.href = "tennis.html";

}


/* ================================
   CLOSE POPUP WHEN CLICKING OUTSIDE
================================ */

window.onclick = function(e) {

    const popup = document.getElementById("popup");

    if (e.target === popup) {

        closePhoto();

    }

};


/* ================================
   BACKGROUND MUSIC
================================ */

window.onload = function() {

    const music = document.getElementById("bgMusic");

    music.volume = 0.4;

    music.play().catch(() => {

        document.body.addEventListener(
            "click",
            function() {

                music.play();

            },
            { once: true }
        );

    });

};

</script>

</body>
</html>
