<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tennis Challenge</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
overflow:hidden;
color:white;
text-align:center;
}

h1{
margin-top:25px;
font-size:30px;
color:#20f1d5;
}

p{
font-size:18px;
margin-top:10px;
}

h2{
margin-top:10px;
font-size:42px;
}

#court{
position:relative;
width:100vw;
height:72vh;
overflow:hidden;
margin-top:20px;
}

#ball{
position:absolute;
font-size:70px;
cursor:pointer;
user-select:none;
transition:transform .08s;
filter:drop-shadow(0 0 12px #fff176);
z-index:5;
}

#complete{

display:none;

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:#101a33;

padding:35px;

border-radius:25px;

width:90%;

max-width:420px;

box-shadow:0 0 30px cyan;

z-index:999;

animation:popup .8s ease;

}

#complete h2{

font-size:38px;

margin-bottom:15px;

color:#20f1d5;

}

#complete p{

font-size:22px;

}

button{

margin-top:25px;

padding:15px 35px;

font-size:20px;

border:none;

border-radius:40px;

background:#ff4f8b;

color:white;

cursor:pointer;

}

button:active{

transform:scale(.95);

}

.confetti{

position:fixed;

width:10px;

height:10px;

top:-20px;

z-index:9999;

animation:fall 3s linear forwards;

}

@keyframes popup{

0%{

transform:translate(-50%,-50%) scale(.4);

opacity:0;

}

70%{

transform:translate(-50%,-50%) scale(1.1);

}

100%{

transform:translate(-50%,-50%) scale(1);

opacity:1;

}

}

@keyframes fall{

to{

transform:translateY(110vh) rotate(720deg);

opacity:0;

}

}

</style>

<script src="./chrome-compat.js"></script>
</head>

<body>

<h1>🎾 Mission 04</h1>

<p>Hit the moving tennis ball 10 times!</p>

<h2>Score :
<span id="score">0</span>/10
</h2>

<div id="court">

<div id="ball" onclick="hitBall()">🥎</div>

</div>

<div id="complete">

<h2>🏆 Mission Complete!</h2>

<p>You unlocked Mission 05 ❤️</p>

<button onclick="window.location.href='garage.html'">

Go To Dream Garage 🏍️

</button>

</div>

<script>

let score = 0;

const ball = document.getElementById("ball");
const court = document.getElementById("court");

let x = 50;
let y = 120;
let dx = 5;
let dy = 4;

function animateBall(){

const maxX = court.clientWidth - 70;
const maxY = court.clientHeight - 70;

x += dx;
y += dy;

if(x <= 0 || x >= maxX){
dx *= -1;
}

if(y <= 0 || y >= maxY){
dy *= -1;
}

ball.style.left = x + "px";
ball.style.top = y + "px";

requestAnimationFrame(animateBall);

}

animateBall();

function hitBall(){

const smash = document.getElementById("smashSound");
smash.currentTime = 0;
smash.play();

if(navigator.vibrate){
navigator.vibrate(40);
}

ball.style.transform = "scale(.75)";

setTimeout(()=>{
ball.style.transform = "scale(1)";
},80);

score++;

document.getElementById("score").innerHTML = score;

dx *= 1.05;
dy *= 1.05;

if(score>=10){

ball.style.display="none";

document.getElementById("complete").style.display="block";

document.getElementById("successSound").play();

launchConfetti();

}

}

function launchConfetti(){

const colors=[
"#ff4f8b",
"#20f1d5",
"#ffd60a",
"#ffffff",
"#7eff7e",
"#66aaff"
];

for(let i=0;i<180;i++){

const confetti=document.createElement("div");

confetti.className="confetti";

confetti.style.left=Math.random()*100+"vw";

confetti.style.background=
colors[Math.floor(Math.random()*colors.length)];

confetti.style.animationDelay=
Math.random()+"s";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},3000);

}

}

</script>

<audio id="successSound">
<source src="success.mp3" type="audio/mpeg">
</audio>

<audio id="smashSound">
<source src="smash.mp3" type="audio/mpeg">
</audio>

</body>
</html>
